<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1726"><title>Responsible Leadership | University Leadership Lab</title>
<style>
:root{color-scheme:dark;--bg:#081320;--panel:#102238;--panel2:#142c45;--line:#2a455e;--text:#eff8ff;--muted:#a8bdcf;--aqua:#4ee0c1;--gold:#ffcf79;--red:#ff8892;--blue:#7db7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -15%,#164764 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.52 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:1100px;margin:auto;padding:18px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 22px}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.mark{display:grid;place-items:center;border-radius:11px;width:36px;height:36px;background:var(--aqua);color:#08312f;font-size:22px}.tag,.mini{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--aqua);font-weight:850}.chip{background:#193a4a;border:1px solid #31596b;color:#d2fdf1;border-radius:100px;padding:6px 10px;font-size:12px}.home-principle{max-width:900px;margin-top:23px;padding:19px 21px;border-left:4px solid var(--aqua);border-radius:0 14px 14px 0;background:#0d303b}.home-principle p{font-size:clamp(16px,2vw,19px);line-height:1.65;margin:9px 0 2px;color:#eaf8f6}.hero{padding:24px 0}.hero h1{font-size:clamp(35px,7vw,74px);line-height:1.04;letter-spacing:-.045em;margin:12px 0 16px;max-width:940px}.hero h1 span{color:var(--aqua)}.lead{font-size:clamp(16px,2vw,20px);color:#d2dfeb;max-width:710px}.card{background:linear-gradient(140deg,#14283f,#0d2034);border:1px solid var(--line);border-radius:19px;padding:21px;box-shadow:0 10px 32px #0002}.card+.card{margin-top:13px}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.eyebrow{font-size:12px;font-weight:800;color:var(--aqua);letter-spacing:.14em;text-transform:uppercase}.muted{color:var(--muted)}h2{font-size:clamp(25px,4vw,35px);line-height:1.16;margin:9px 0 14px;letter-spacing:-.03em}h3{font-size:18px;margin:0 0 9px}p{margin:8px 0 13px}.btn{border:1px solid #42657b;padding:13px 17px;border-radius:12px;color:var(--text);background:#17334a;font-weight:750;text-align:center}.btn.main{background:var(--aqua);color:#072c2b;border-color:var(--aqua)}.btn.alt{background:transparent}.btn.warn{background:#4e3035;border-color:#82505a}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.stretch{width:100%}.stepper{display:flex;gap:5px;align-items:center;margin:5px 0 20px}.stepper div{height:5px;background:#25445c;border-radius:7px;flex:1}.stepper div.on{background:var(--aqua)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.metric{padding:13px 15px;background:#092238;border:1px solid #2b4a60;border-radius:13px}.metric strong{display:block;font-size:27px;line-height:1.1}.metric small{color:var(--muted)}.option{display:flex;gap:12px;align-items:flex-start;padding:15px;margin:10px 0;border:1px solid #32536c;background:#122a42;border-radius:13px;cursor:pointer}.option:has(input:checked){border-color:var(--aqua);background:#173e4c}.option input{accent-color:var(--aqua);margin-top:5px;width:19px;height:19px}.option b{display:block}.option small{display:block;color:var(--muted);margin-top:3px}.budgetrow{padding:17px 0;border-bottom:1px solid var(--line)}.budgetrow:last-child{border-bottom:none}.budgetrow .heading{display:flex;justify-content:space-between;gap:12px}.budgetrow .heading b{font-size:15px}.amount{font-size:19px;font-weight:850;color:var(--gold);white-space:nowrap}.budgetrow input{width:100%;accent-color:var(--aqua);margin:17px 0 6px}.tick{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.field{width:100%;background:#081e30;border:1px solid #47647a;color:#f2f8ff;padding:13px;border-radius:11px;min-height:115px;resize:vertical}.field.short{min-height:0}.question{background:#0c2f39;border-left:3px solid var(--aqua);padding:14px 16px;margin:14px 0;border-radius:0 10px 10px 0}.impact{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.impact div{padding:13px;border:1px solid var(--line);border-radius:12px;background:#0b2237}.impact strong{font-size:23px;display:block;color:var(--gold)}.note{font-size:12px;color:#a9c5d4}.alert{background:#3b2930;border:1px solid #75505a;border-radius:12px;padding:15px;margin:14px 0}.good{color:var(--aqua)}.bad{color:var(--red)}.progress{height:10px;background:#062339;border-radius:8px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:var(--aqua)}.hidden{display:none!important}ul{padding-left:19px}li{margin:6px 0}.stage{display:flex;justify-content:space-between;gap:12px;align-items:start}.stage .time{white-space:nowrap;font-size:12px;background:#1b3c4e;padding:6px 10px;border-radius:25px;color:#c7f2eb}.summaryrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.summaryrow:last-child{border:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#071723ee;backdrop-filter:blur(12px);border-top:1px solid #33536b;padding:10px max(16px,calc((100vw - 1080px)/2));z-index:5}.bottom .inner{display:flex;align-items:center;justify-content:space-between;gap:12px}.bottom .inner span{font-size:12px;color:var(--muted)}.footer{text-align:center;font-size:12px;color:#8ea9bb;padding:18px}textarea::placeholder,input::placeholder{color:#8fa9ba}details{background:#122b40;padding:15px;border:1px solid #36536b;border-radius:12px}details summary{cursor:pointer;font-weight:800}.printonly{display:none}.timer-pill{border:1px solid #357e77;border-radius:12px;background:#103c42;padding:8px 11px;color:#64ecd3;font-weight:850;font-variant-numeric:tabular-nums}.timer-pill.overdue{color:#ffcf79;border-color:#9c7139;background:#342a22}.fac-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fac-bar{height:13px;border-radius:8px;background:#0b2237;overflow:hidden}.fac-bar span{display:block;height:100%;background:#4ee0c1}.fac-wrap{max-width:950px;margin:auto}.fac-lock{max-width:480px;margin:45px auto}.fac-lock input{width:100%;background:#081e30;color:white;border:1px solid #47647a;padding:13px;border-radius:10px}.fac-status{font-size:13px;color:#afd3dc}@media(max-width:720px){.fac-grid{grid-template-columns:1fr}}@media(max-width:720px){.two,.three{grid-template-columns:1fr}.shell{padding:12px 14px 116px}.card{padding:16px}.hero{padding:17px 0}.hero h1{font-size:43px}.impact{grid-template-columns:1fr 1fr}.top{padding-bottom:8px}.top .brand{font-size:10px}.bottom .inner span{max-width:135px}.stage{display:block}.stage .time{display:inline-block;margin-bottom:8px}}@media print{body{background:white;color:black}.top,.bottom,.actions,.stepper,.noprint{display:none!important}.shell{max-width:none;padding:0}.card{background:white;color:black;box-shadow:none;border:1px solid #bbb;break-inside:avoid}.muted,.note{color:#444}.printonly{display:block}.hero h1{color:#111}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="mark">◎</span><span>RESPONSIBLE LEADERSHIP<br><span style="color:#91abc0;letter-spacing:.07em">LEADERSHIP LAB</span></span></div><div class="meta"><span class="chip">University edition</span><button class="btn alt" style="padding:7px 11px;font-size:12px" id="facBtn">Facilitator</button></div></header><div id="screen"></div><footer class="footer">A fictional university leadership experience · AI analysis sends answers only when requested</footer></div><div class="bottom" id="bottom"><div class="inner"><span id="footLabel">Responsible decisions. Real trade-offs.</span><div class="actions" style="margin:0"><button class="btn alt" id="backBtn" style="display:none">Back</button><button class="btn main" id="nextBtn">Enter the Lab →</button></div></div></div>
<script>
const labels=['Research excellence','Green campus','Student equity','Staff wellbeing','Digital & AI'];const defs=[['Research excellence','New laboratories, research capacity and scholarly impact.'],['Green campus','Energy efficiency, emissions reduction and lower long-term costs.'],['Student equity','B40 scholarships, access, accessibility and retention support.'],['Staff wellbeing','Workload reform, capability development and support.'],['Digital & AI','Digital learning, infrastructure and responsible AI capacity.']];
const state={step:0,name:'',role:'',alloc:[4,4,4,4,4],first:null,reasons:'',revised:'',tradeoff:'',donor:'',donorReason:'',board:'',commit:'',ai:'',aiStatus:'',history:[]};const $=id=>document.getElementById(id);const money=n=>'RM '+Number(n).toFixed(1)+'m';const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sum=()=>state.alloc.reduce((a,b)=>a+Number(b),0);const remaining=()=>20-sum();const steps=['Welcome','The brief','Allocate','New evidence','Ethical test','Board defence','Decision report','Debrief'];
const STAGE_MINUTES=[0,2,5,7,7,6,3,20];let facilitatorMode=false,facilitatorCode='',facilitatorView='results',timerInterval=null;const cohortId=(()=>{let id=localStorage.getItem('rl-anon-id');if(!id){id=crypto.randomUUID?.()||('anon-'+Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('rl-anon-id',id)}return id})();
function stageClock(){if(!state.stageStartedAt)state.stageStartedAt=Date.now();const elapsed=Math.floor((Date.now()-state.stageStartedAt)/1000);const target=(STAGE_MINUTES[state.step]||20)*60;const left=target-elapsed;return {display:(left<0?'+':'')+Math.floor(Math.abs(left)/60).toString().padStart(2,'0')+':'+(Math.abs(left)%60).toString().padStart(2,'0'),overdue:left<0}}
function updateClock(){const el=$('liveTimer');if(!el||facilitatorMode)return;const t=stageClock();el.textContent=(t.overdue?'Over time ':'Time left ')+t.display;el.classList.toggle('overdue',t.overdue)}
async function publishAnonymous(){if(!state.first||state.submitted)return;try{const data={id:cohortId,initial:state.first,final:state.alloc,donor:state.donor,completedAt:new Date().toISOString()};const r=await fetch('/.netlify/functions/workshop-results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('Collective submission unavailable');state.submitted=true;persist()}catch(e){console.warn('Anonymous collective submission failed:',e.message)}}

function questionFrom(t){const x=t.toLowerCase();if(!t.trim())return 'What evidence supports this decision, and which stakeholder might reasonably disagree?';let lines=[];if(/rank|research|publicat/.test(x))lines.push('What protects student access and staff capacity while you pursue research reputation?');if(/student|scholar|equity|b40/.test(x))lines.push('How will you demonstrate improved retention and learning, rather than simply higher expenditure?');if(/carbon|green|energy|solar/.test(x))lines.push('What is the verified baseline and payback period, and who bears the up-front cost?');if(/staff|workload|wellbeing/.test(x))lines.push('What structural workload change accompanies this investment?');if(/ai|digital|data/.test(x))lines.push('Who is accountable for data protection, access and educational effectiveness?');if(/donor|sponsor|corporate/.test(x))lines.push('Would the conditions survive public disclosure and an independent conflict-of-interest review?');return lines[0]||'What evidence might change your judgement, and who would be most affected if you are wrong?'}
function allocationInsights(){const a=state.alloc;let m=Math.max(...a),i=a.indexOf(m),z=[];z.push('Your largest allocation is '+labels[i].toLowerCase()+' ('+money(m)+'). Explain why this creates greater public value than the alternatives.');if(a[2]<3)z.push('Student equity has less than RM3m. What protects access and retention?');if(a[3]<3)z.push('Staff wellbeing has less than RM3m. Could limited delivery capacity undermine other commitments?');if(a[1]<3)z.push('The green campus allocation is below RM3m. How will climate and energy exposure be managed?');if(a[4]>5)z.push('Digital and AI investment exceeds RM5m. What governance and learning-impact safeguards apply?');return z.slice(0,3)}
function header(k,title,time,lead){return `<div class="stepper" aria-label="Simulation progress">${steps.map((_,i)=>`<div class="${i<=k?'on':''}"></div>`).join('')}</div><div class="stage"><div><div class="eyebrow">Stage ${k} of 7 · ${steps[k]}</div><h2>${title}</h2></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><span class="time">${time}</span><span id="liveTimer" class="timer-pill" role="timer">Time left --:--</span></div></div><p class="muted">${lead}</p>`}
function budgetRows(){return defs.map((d,i)=>`<div class="budgetrow"><div class="heading"><div><b>${d[0]}</b><div class="note">${d[1]}</div></div><span class="amount" id="amt${i}">${money(state.alloc[i])}</span></div><input id="slider${i}" type="range" min="0" max="20" step="0.5" value="${state.alloc[i]}" aria-label="Allocate funds to ${d[0]}"><div class="tick"><span>RM 0m</span><span>RM 20m</span></div></div>`).join('')}
function budgetPanel(){return `<div class="card"><div class="stage"><div><div class="eyebrow">Your allocation</div><div style="font-size:34px;font-weight:900" id="spent">${money(sum())}</div><div class="muted">of RM 20.0m</div></div><div style="text-align:right"><div class="eyebrow">Remaining</div><strong id="remain" style="font-size:25px">${money(remaining())}</strong></div></div><div class="progress"><span id="spentbar" style="width:${sum()*5}%"></span></div><div id="budgetAlert" class="note">${remaining()===0?'<span class="good">Fully allocated. Ready to proceed.</span>':'Allocate the remaining funds before continuing.'}</div><p class="note">Each category can receive up to RM20m, but all five combined must total RM20m. To increase one category when the budget is full, reduce another first.</p></div>`}
function allocationsTable(a){return a.map((v,i)=>`<div class="summaryrow"><span>${labels[i]}</span><b>${money(v)}</b></div>`).join('')}
function render(){let s=state.step,html='';if(s===0){html=`<section class="hero"><div class="eyebrow">60-minute leadership workshop · interactive experience</div><h1>Responsible <span>Leadership.</span><br>Lead what matters.</h1><p class="lead">Making difficult decisions through the lens of SDG and ESG. Discover what happens when institutional values, budgets and accountability collide.</p><div class="home-principle" role="note"><div class="eyebrow">The leadership lens</div><p>SDG tells us what kind of world we want to help create. ESG asks how responsibly we operate and govern ourselves. Responsible leadership determines what we actually do when these ambitions compete with financial, institutional and human realities.</p></div></section><div class="two"><div class="card"><div class="eyebrow">Your mission</div><h2>The RM20 Million Dilemma</h2><p>You are a member of a fictional university's executive team. Allocate a limited fund, adapt to new evidence, confront an ethical dilemma, then defend your choices to the Board.</p><div class="three"><div class="metric"><strong>25</strong><small>min play</small></div><div class="metric"><strong>20</strong><small>min debrief</small></div><div class="metric"><strong>5</strong><small>funding priorities</small></div></div></div><div class="card"><div class="eyebrow">What counts as success?</div><p>Not a perfect ESG score. Not an impressive report.</p><p><b>A defensible decision</b> that weighs evidence, consequences, fairness, governance and long-term institutional value.</p><div class="question">“What did your choices reveal about what your university truly values?”</div><p class="note">Works on mobile, tablet and desktop. Your written responses save on this device. On completing the activity, anonymous funding and donor choices are shared with the facilitator when connected.</p></div></div>`}
if(s===1){html=header(1,'A university at a crossroads','~2 min','Read your mandate. You cannot solve every problem with one allocation.')+`<div class="two"><div class="card"><div class="eyebrow">The Board mandate</div><h3>You have RM20 million</h3><p>Your university has one-off discretionary strategic funding. It faces pressure to strengthen research, reduce operating emissions, improve student access, protect staff and modernise digital systems.</p><p>The funding is not enough to meet every request. You must make trade-offs.</p><div class="alert"><b>Rules</b><br>Allocate exactly RM20m across five areas in RM0.5m increments. Each area can receive RM0m to RM20m. The app prevents spending more than RM20m in total. There is no pre-set correct answer.</div><p class="note">This is a fictional teaching scenario, not actual UNITEN financial or ESG information.</p></div><div class="card"><label class="eyebrow" for="name">Name or alias (optional)</label><input class="field short" id="name" maxlength="80" placeholder="e.g. Academic Leader 07" value="${clean(state.name)}"><p class="eyebrow">Your leadership lens</p><div class="muted">Consider students, staff, partners, communities and future generations.</div><div class="question">What outcome would make this investment worthwhile five years from now?</div><textarea class="field" id="role" placeholder="A sentence about your leadership priority...">${clean(state.role)}</textarea></div></div>`}
if(s===2){html=header(2,'Put your money where your values are','~5 min','Set your initial allocation. Explain the choice before receiving new information.')+`<div class="two"><div class="card">${budgetRows()}</div><div><div id="budgetHolder">${budgetPanel()}</div><div class="card"><div class="eyebrow">Commit to a rationale</div><label for="reasons"><b>Why this allocation?</b></label><textarea id="reasons" class="field" placeholder="Explain your top priority, biggest trade-off and who bears the cost...">${clean(state.reasons)}</textarea><div class="question" id="challenge">${clean(questionFrom(state.reasons))}</div><p class="note">This challenge is generated from your words using on-device rules. It is not a live AI response.</p></div></div></div>`}
if(s===3){html=header(3,'The facts have changed','~7 min','Your initial choice is recorded. New signals challenge your assumptions.')+`<div class="two"><div><div class="card"><div class="eyebrow">Breaking developments</div><div class="alert"><b>Energy-price risk</b><br>Facilities forecasts show a sharp potential rise in operating expenditure. Energy upgrades could lower exposure, but the savings are uncertain without an audit.</div><div class="alert"><b>Student retention concern</b><br>Internal analysis flags deteriorating retention among financially vulnerable students. Root causes still need validation.</div><div class="alert"><b>Staff delivery constraint</b><br>Workload feedback suggests teams may struggle to implement new initiatives at the planned pace.</div><p class="note">These are scenario assumptions, not claims about real institutional trends.</p></div><div class="card"><div class="eyebrow">Your original position</div>${allocationsTable(state.first||state.alloc)}</div></div><div><div class="card"><h3>Revise your RM20m allocation</h3>${budgetRows()}</div><div id="budgetHolder">${budgetPanel()}</div><div class="card"><label for="revised"><b>What changed your mind, or why did you hold firm?</b></label><textarea class="field" id="revised" placeholder="Identify evidence, uncertainties, affected stakeholders and your decision...">${clean(state.revised)}</textarea><div class="question" id="challenge">${clean(questionFrom(state.revised))}</div><div style="margin-top:22px"><label for="tradeoff"><b>What did you trade off?</b></label><p class="note" style="margin:8px 0 12px">Compare your revised allocation with the original. What received less funding, what benefits or opportunities might be delayed, and who bears the consequences?</p><textarea class="field" id="tradeoff" placeholder="I reduced funding for... to prioritise... The opportunity cost is... Those most affected are...">${clean(state.tradeoff)}</textarea></div></div></div></div>`}
if(s===4){html=header(4,'An offer with strings attached','~7 min','A donor offers RM8m to establish a high-profile sustainability innovation centre.')+`<div class="two"><div class="card"><div class="eyebrow">Confidential Board paper</div><h3>The RM8 million offer</h3><p>The prospective corporate donor operates in an emissions-intensive industry and has publicly contested environmental claims. It asks for prominent naming rights, first review of research outputs before publication, and a seat on the centre’s steering committee.</p><p>Some stakeholders see an opportunity to fund real-world transition research. Others worry about research independence, institutional reputation and greenwashing.</p><div class="alert"><b>Decision boundary</b><br>The donor funding is separate from the original RM20m. Your existing budget remains unchanged. You must decide whether and under what safeguards to proceed.</div><p class="note">The sponsor is fictional. This is not an allegation about any real company.</p></div><div class="card"><div class="eyebrow">Your decision</div>${[['accept','Accept the offer','Proceed under the terms presented.'],['negotiate','Negotiate binding safeguards','Require publication independence, independent oversight, conflict-of-interest management, transparent disclosures and exit clauses.'],['reject','Decline the offer','Protect institutional independence and find alternative financing.']].map(o=>`<label class="option"><input type="radio" name="donor" value="${o[0]}" ${state.donor===o[0]?'checked':''}><span><b>${o[1]}</b><small>${o[2]}</small></span></label>`).join('')}<label for="donorReason"><b>Defend your decision</b></label><textarea class="field" id="donorReason" placeholder="Who benefits, which risks are acceptable, and what safeguards are non-negotiable?">${clean(state.donorReason)}</textarea><div class="question" id="challenge">${clean(questionFrom(state.donorReason))}</div></div></div>`}
if(s===5){html=header(5,'The Board is listening','~6 min','You have 90 seconds to state your strategic case, then respond to a critical question.')+`<div class="two"><div class="card"><div class="eyebrow">Decision snapshot</div>${allocationsTable(state.alloc)}<hr style="border:0;border-top:1px solid var(--line)"><b>Donor decision</b><p>${clean(({accept:'Accept',negotiate:'Negotiate safeguards',reject:'Decline'}[state.donor]||'Not selected'))}</p><div class="question"><b>Board challenge</b><p id="boardQuestion">${clean(allocationInsights()[0])}</p></div></div><div class="card"><div class="eyebrow">Your defence</div><p>Explain the institutional purpose, which alternatives you rejected, who bears the costs, what evidence you need, and how you will review the decision.</p><textarea class="field" id="board" style="min-height:220px" placeholder="Chair, our strategy prioritises... We recognise the risk to... We will monitor...">${clean(state.board)}</textarea><p class="note">Your defence will appear in your personal decision report. Consider recording a 90-second spoken defence with your group as well.</p></div></div>`}
if(s===6){let shifts=(state.first||state.alloc).map((x,i)=>state.alloc[i]-x);let changed=shifts.map((x,i)=>x===0?'':`${labels[i]} ${x>0?'+':''}${money(x)}`).filter(Boolean);let prompts=allocationInsights();html=header(6,'Your Responsible Leadership Report','~3 min','A record of your decisions, trade-offs and reflection. Review it before the group debrief.')+`<div class="two"><div class="card"><div class="eyebrow">Decision record</div><h3>${clean(state.name||'University leader')}</h3><p class="muted">Final allocation</p>${allocationsTable(state.alloc)}<p><b>Changes since initial allocation</b><br>${changed.length?changed.map(clean).join('; '):'No changes. You maintained your initial priorities.'}</p><p><b>Donor position</b><br>${clean(({accept:'Accept as offered',negotiate:'Negotiate with safeguards',reject:'Reject'}[state.donor])||'No decision')}</p></div><div class="card"><div class="eyebrow">Reflective feedback</div><h3>What your choices suggest</h3>${prompts.map(p=>`<div class="question">${clean(p)}</div>`).join('')}<h3>Reasoning record</h3><p><b>Initial rationale</b><br>${clean(state.reasons||'Not recorded')}</p><p><b>Response to new evidence</b><br>${clean(state.revised||'Not recorded')}</p><p><b>Trade-offs acknowledged</b><br>${clean(state.tradeoff||'Not recorded')}</p><p><b>Donor rationale</b><br>${clean(state.donorReason||'Not recorded')}</p><p><b>Board defence</b><br>${clean(state.board||'Not recorded')}</p></div></div><div class="card"><div class="eyebrow">Your commitment</div><label for="commit"><b>What one real leadership decision will you approach differently?</b></label><textarea class="field" id="commit" placeholder="When I return to my university, I will...">${clean(state.commit)}</textarea><div class="actions"><button class="btn" id="print">Print / save as PDF</button><button class="btn" id="export">Download decision report</button><button class="btn alt" id="copy">Copy summary</button></div><p class="note">Feedback is question-based and not an ethical performance score. No server receives your entries.</p></div>`}
if(s===7){html=`<div class="hero"><div class="eyebrow">Personalised leadership debrief · AI analysis</div><h1>What did your <span>choices</span> reveal?</h1><p class="lead">Your debrief draws on your own funding decisions, revisions, acknowledged trade-offs, donor judgement and Board defence, analysed through Purpose, People, Planet, Integrity and Future, and linked to the SDGs and ESG.</p></div><div class="card" style="margin-bottom:14px"><div class="eyebrow">Your decision trajectory</div><div class="two"><div><h3>Initial allocation</h3>${allocationsTable(state.first||state.alloc)}</div><div><h3>Final allocation</h3>${allocationsTable(state.alloc)}</div></div><p><b>Donor position</b> · ${clean(({accept:'Accepted as offered',negotiate:'Negotiated safeguards',reject:'Declined'}[state.donor]||'Not recorded'))}</p></div><div class="card" aria-live="polite"><div class="eyebrow">Your AI leadership debrief</div><p class="muted">Your decisions will be examined through five lenses: <b>Purpose, People, Planet, Integrity and Future</b>. The analysis will distinguish SDG contributions from ESG responsibilities and flag evidence gaps and trade-offs.</p><div id="aiDebrief">${state.ai?formatDebrief(state.ai):'<p class="muted">Select “Generate my AI debrief” to request a contextual review of your decisions.</p>'}</div><div class="actions"><button class="btn primary" id="generateAI">${state.ai?'Regenerate AI debrief':'Generate my AI debrief'}</button><button class="btn" id="copyAI" ${state.ai?'':'disabled'}>Copy AI debrief</button></div><p class="note">This feature requires a configured secure AI endpoint. Only submit fictional scenario answers; avoid personal or confidential institutional data. AI feedback is reflective guidance, not a formal ESG assessment. Your responses are transmitted to the AI service only when you press Generate.</p></div><details class="card" style="margin-top:14px"><summary style="cursor:pointer;font-weight:800;font-size:1.1rem">Facilitator's 20-minute group discussion</summary><div class="three"><div><div class="eyebrow">5 minutes</div><h3>What did you optimise?</h3><p>Which proposals received the most funding? Who carried the cost?</p></div><div><div class="eyebrow">7 minutes</div><h3>Which principle held?</h3><p>How did you balance finances, ethics and sustainability?</p></div><div><div class="eyebrow">8 minutes</div><h3>What will change?</h3><p>What real institutional decision will you approach differently?</p></div></div><div class="question">Responsible leadership is revealed by the decisions we can defend, the trade-offs we acknowledge, and the consequences we are willing to monitor.</div></details>`}
$('screen').innerHTML=html;updateClock();$('backBtn').style.display=s>0&&s<7?'inline-block':'none';$('nextBtn').textContent=['Enter the Lab →','Allocate the RM20m →','Submit initial decision →','Confirm revised decision →','Face the Board →','Generate my report →','Open personalised debrief →','Restart simulation'][s];$('footLabel').textContent=s===0?'Responsible decisions. Real trade-offs.':s===7?'Facilitator debrief':steps[s]+' · '+(s===2||s===3?money(remaining())+' left':'Leadership challenge');bind();}
function saveFields(){if($('name'))state.name=$('name').value;if($('role'))state.role=$('role').value;if($('reasons'))state.reasons=$('reasons').value;if($('revised'))state.revised=$('revised').value;if($('tradeoff'))state.tradeoff=$('tradeoff').value;if($('donorReason'))state.donorReason=$('donorReason').value;if($('board'))state.board=$('board').value;if($('commit'))state.commit=$('commit').value;persist()}
function persist(){try{localStorage.setItem('beyond-compliance-v1',JSON.stringify(state))}catch(e){}}
function bind(){
 document.querySelectorAll('input[type=range]').forEach(el=>{
  const i=Number(el.id.replace('slider',''));
  el.max=Math.min(20,20-(sum()-state.alloc[i]));
  el.addEventListener('input',()=>{
   state.alloc[i]=Number(el.value);
   $('amt'+i).textContent=money(state.alloc[i]);
   $('spent').textContent=money(sum());
   $('remain').textContent=money(remaining());
   $('spentbar').style.width=Math.min(100,sum()*5)+'%';
   $('budgetAlert').innerHTML=remaining()===0?'<span class="good">Fully allocated. Ready to proceed.</span>':'Allocate all available funding before continuing.';
   $('footLabel').textContent=money(remaining())+' left';
   document.querySelectorAll('input[type=range]').forEach(sl=>{
    const j=Number(sl.id.replace('slider',''));
    sl.max=Math.max(state.alloc[j],Math.min(20,20-(sum()-state.alloc[j])));
   });
   persist();
  });
 });
 document.querySelectorAll('input[name=donor]').forEach(el=>el.addEventListener('change',()=>{state.donor=el.value;persist()}));
 ['reasons','revised','donorReason'].forEach(id=>{let el=$(id);if(el)el.addEventListener('input',()=>{$('challenge').textContent=questionFrom(el.value);saveFields()})});
 ['name','role','board','commit','tradeoff'].forEach(id=>{let el=$(id);if(el)el.addEventListener('input',saveFields)});
 if($('generateAI'))$('generateAI').onclick=generateDebrief; if($('copyAI'))$('copyAI').onclick=()=>GenCopy(state.ai);
 if($('print'))$('print').onclick=()=>{saveFields();window.print()};
 if($('export'))$('export').onclick=()=>download();
 if($('copy'))$('copy').onclick=()=>{saveFields();navigator.clipboard?.writeText(report()).then(()=>alert('Summary copied.'),()=>alert('Copy unavailable. Use Download instead.'))}
}

function advance(){saveFields();if(state.step===2||state.step===3){if(Math.abs(remaining())>0.01){alert('Please allocate exactly RM20 million before continuing.');return}}if(state.step===2){if(state.reasons.trim().length<25){alert('Please give a brief rationale (at least 25 characters) before committing.');return}state.first=[...state.alloc]}if(state.step===3&&state.revised.trim().length<20){alert('Explain your response to the new evidence (at least 20 characters).');return}if(state.step===3&&state.tradeoff.trim().length<20){alert('Describe the trade-off and who is affected (at least 20 characters).');return}if(state.step===4){if(!state.donor){alert('Please select a donor decision.');return}if(state.donorReason.trim().length<20){alert('Please explain your donor decision (at least 20 characters).');return}}if(state.step===5&&state.board.trim().length<35){alert('Please provide a Board defence (at least 35 characters).');return}if(state.step===7){if(!confirm('Restart the simulation and clear the current decision record on this device?'))return;Object.assign(state,{step:0,name:'',role:'',alloc:[4,4,4,4,4],first:null,reasons:'',revised:'',tradeoff:'',donor:'',donorReason:'',board:'',commit:'',ai:'',aiStatus:'',submitted:false,stageStartedAt:Date.now()})}else{state.step++;state.stageStartedAt=Date.now()}persist();if(state.step===6)publishAnonymous();window.scrollTo({top:0,behavior:'instant'});render()}
function report(){return `RESPONSIBLE LEADERSHIP — DECISION REPORT\nParticipant: ${state.name||'University leader'}\nLeadership priority: ${state.role}\n\nINITIAL ALLOCATION\n${(state.first||state.alloc).map((v,i)=>labels[i]+': '+money(v)).join('\n')}\n\nFINAL ALLOCATION\n${state.alloc.map((v,i)=>labels[i]+': '+money(v)).join('\n')}\n\nINITIAL RATIONALE\n${state.reasons}\n\nRESPONSE TO NEW EVIDENCE\n${state.revised}\n\nTRADE-OFFS ACKNOWLEDGED\n${state.tradeoff}\n\nDONOR DECISION\n${state.donor}\n${state.donorReason}\n\nBOARD DEFENCE\n${state.board}\n\nREFLECTION PROMPTS\n${allocationInsights().join('\n')}\n\nPERSONAL COMMITMENT\n${state.commit}\n\nAI LEADERSHIP DEBRIEF\n${state.ai||'Not generated'}\n\nFictional educational scenario. AI debrief, when generated, uses a remote model and should be critically reviewed.`}

function formatDebrief(txt){return `<div class="debrief-text">${clean(txt).split(/\n\s*\n/).filter(Boolean).map(part=>`<p style="white-space:pre-wrap;line-height:1.65">${part}</p>`).join('')}</div>`}
function GenCopy(t){navigator.clipboard?.writeText(t||'').then(()=>alert('Debrief copied.'),()=>alert('Unable to copy on this browser.'))}
async function generateDebrief(){
 saveFields();let el=$('aiDebrief'),btn=$('generateAI');btn.disabled=true;btn.textContent='Analysing your decisions…';el.innerHTML='<p class="muted">Reviewing your evidence, funding choices and ethical judgement…</p>';
 const payload={participant:{role:state.role,commit:state.commit},initialAllocation:state.first||state.alloc,finalAllocation:state.alloc,initialRationale:state.reasons,newEvidenceResponse:state.revised,tradeoffs:state.tradeoff,donorDecision:state.donor,donorRationale:state.donorReason,boardDefence:state.board};
 try{let res=await fetch('/.netlify/functions/leadership-debrief',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let json=await res.json().catch(()=>({}));if(!res.ok)throw new Error(json.error||'The AI service is unavailable.');if(!json.debrief||typeof json.debrief!=='string')throw new Error('No AI debrief was returned.');state.ai=json.debrief;persist();el.innerHTML=formatDebrief(state.ai);if($('copyAI'))$('copyAI').disabled=false}
 catch(e){el.innerHTML=`<p style="color:var(--gold)"><b>AI debrief not available.</b> ${clean(e.message)}</p><p class="note">The app must be deployed to Netlify with OPENAI_API_KEY configured server-side. Opening the HTML directly or publishing on ordinary static hosting will not activate live AI feedback.</p><p>As an alternative, download your decision report and ask an AI assistant to analyse it using the responsible-leadership criteria.</p>`}
 finally{btn.disabled=false;btn.textContent=state.ai?'Regenerate AI debrief':'Try AI debrief again'}
}

function download(){saveFields();const b=new Blob([report()],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Responsible_Leadership_Decision_Report.txt';a.click();URL.revokeObjectURL(u)}
async function loadCollective(){const output=$('facContent');if(!output)return;output.innerHTML='<p class="muted">Retrieving anonymous completed submissions…</p>';try{const response=await fetch('/.netlify/functions/workshop-results',{method:'GET',headers:{'X-Facilitator-Code':facilitatorCode}});const data=await response.json();if(!response.ok)throw Error(data.error||'Cannot retrieve results');let n=data.count||0;let avg=data.averages||[0,0,0,0,0],first=data.initialAverages||[0,0,0,0,0];let donor=data.donor||{};output.innerHTML=`<div class="card"><div class="eyebrow">Live anonymous cohort dashboard</div><h2>${n} completed participant${n===1?'':'s'}</h2><p class="muted">Average allocations out of RM20m. Only completed submissions appear. No participant names, written responses or personal AI debriefs are collected.</p>${n?labels.map((x,i)=>`<div style="margin:21px 0"><div class="summaryrow"><b>${x}</b><strong>${money(avg[i])}</strong></div><div class="fac-bar"><span style="width:${avg[i]*5}%"></span></div><p class="note">Initial ${money(first[i])} · Change ${avg[i]-first[i]>=0?'+':''}${money(avg[i]-first[i])}</p></div>`).join(''):'<p>Ask participants to complete the Board defence and open their decision report. Their anonymised results will be sent automatically when the shared backend is available.</p>'}</div><div class="card"><div class="eyebrow">Ethical sponsorship decision</div>${[['accept','Accept as offered'],['negotiate','Negotiate safeguards'],['reject','Decline']].map(([key,label])=>`<div class="summaryrow"><span>${label}</span><b>${donor[key]||0}</b></div>`).join('')}<p class="note">Results update when you press Refresh. This is descriptive cohort data, not an ESG score or a ranking of responsible leaders.</p></div><div class="actions"><button class="btn main" id="facRefresh">Refresh results</button></div>`;$('facRefresh').onclick=loadCollective}catch(e){output.innerHTML=`<div class="alert"><b>Shared results unavailable.</b><p>${clean(e.message)}</p><p>Collective results require the deployed Netlify function and persistent Netlify Blobs storage. Opening the HTML locally cannot combine results across devices.</p></div><button class="btn" id="facRetry">Retry</button>`;$('facRetry').onclick=loadCollective}}
function renderFacilitator(){const screen=$('screen');$('bottom').style.display='none';if(!facilitatorCode){screen.innerHTML=`<div class="fac-lock card"><div class="eyebrow">Facilitator access</div><h2>Workshop control room</h2><p>Enter the facilitator access code to see the collective results and facilitated debrief.</p><form id="facForm"><label for="facCode">Access code</label><input id="facCode" type="password" autocomplete="off" required placeholder="Facilitator code"><p class="bad" id="facError" role="alert"></p><div class="actions"><button class="btn main" type="submit">Unlock dashboard</button><button class="btn alt" type="button" id="facClose">Return to simulation</button></div></form></div>`;$('facClose').onclick=closeFacilitator;$('facForm').onsubmit=async e=>{e.preventDefault();const code=$('facCode').value.trim();$('facError').textContent='Checking access…';try{const r=await fetch('/.netlify/functions/workshop-results',{headers:{'X-Facilitator-Code':code}});if(!r.ok)throw Error(r.status===401?'Incorrect access code.':'Server authentication unavailable. Deploy the Netlify functions to enable secure access.');facilitatorCode=code;renderFacilitator()}catch(err){$('facError').textContent=err.message}};return}
screen.innerHTML=`<div class="fac-wrap"><div class="hero"><div class="eyebrow">Facilitator · Responsible Leadership</div><h1>Workshop <span>control room.</span></h1><p class="lead">Explore anonymous cohort decisions, then lead the discussion about SDG, ESG, trade-offs and accountability.</p></div><div class="actions"><button class="btn ${facilitatorView==='results'?'main':''}" id="facResults">View collective results</button><button class="btn ${facilitatorView==='debrief'?'main':''}" id="facDebrief">View facilitator debrief</button><button class="btn alt" id="facClose">Return to participant view</button></div><div id="facContent" style="margin-top:20px"></div></div>`;$('facResults').onclick=()=>{facilitatorView='results';renderFacilitator()};$('facDebrief').onclick=()=>{facilitatorView='debrief';renderFacilitator()};$('facClose').onclick=closeFacilitator;
if(facilitatorView==='results'){loadCollective();return}
$('facContent').innerHTML=`<div class="card"><div class="eyebrow">Facilitated group discussion · 20 minutes</div><h2>What did your choices reveal?</h2><p>No risk-free answer exists. Responsible leadership is demonstrated by transparent reasoning, recognition of affected stakeholders, willingness to revise and accountability for consequences.</p><div class="three"><div class="card"><div class="eyebrow">5 minutes</div><h3>What did you optimise?</h3><p>Which priorities gained funding? What was sacrificed, and by whom?</p></div><div class="card"><div class="eyebrow">7 minutes</div><h3>Which principle held?</h3><p>How did leaders weigh finances, environmental risks, social equity and governance integrity?</p></div><div class="card"><div class="eyebrow">8 minutes</div><h3>What will change?</h3><p>Identify one actual institutional decision requiring different evidence, consultation or accountability.</p></div></div></div><div class="card"><div class="eyebrow">Responsible Leadership decision lens</div>${[['Purpose','Does this advance our educational and research mission?'],['People','Who benefits, and who bears the cost?'],['Planet','What environmental consequences remain unmeasured?'],['Integrity','Can the decision withstand public scrutiny and conflicts-of-interest review?'],['Future','Which longer-term consequences require monitoring?']].map(([a,b])=>`<div class="summaryrow"><b>${a}</b><span>${b}</span></div>`).join('')}<div class="question">SDG describes our desired contribution to the world. ESG describes how responsibly we manage our impacts, risks and governance. Leadership is tested by what we choose when these compete.</div><p class="note">Individual AI debriefs remain private to participants. The dashboard summarises allocations and donor choices only.</p></div>`}
function closeFacilitator(){facilitatorMode=false;$('bottom').style.display='';render()}
$('nextBtn').onclick=advance;$('backBtn').onclick=()=>{saveFields();if(state.step>0){state.step--;state.stageStartedAt=Date.now();persist();render();window.scrollTo(0,0)}};$('facBtn').onclick=()=>{saveFields();facilitatorMode=true;renderFacilitator();window.scrollTo(0,0)};try{const old=JSON.parse(localStorage.getItem('beyond-compliance-v1'));if(old&&Array.isArray(old.alloc)&&old.alloc.length===5)Object.assign(state,old);if(!state.stageStartedAt)state.stageStartedAt=Date.now();if(state.step>=6&&!state.submitted)publishAnonymous()}catch(e){}render();setInterval(updateClock,1000);
</script></body></html>
